services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5436:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Crea la base propia de Django. Sólo corre en la primera inicializacion del volumen.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/amacneil/dbmate:2.35.1
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable&search_path=${DB_SCHEMA}"
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    command: ["--wait", "--wait-timeout", "60s", "migrate"]
    volumes:
      - ./migrations:/db/migrations:ro

  paradas-faena:
    build: .
    image: paradas-faena:2.0.0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: America/Argentina/Buenos_Aires
      REDIS_URL: redis://redis:6379/0
      DB_HOST: db
      DB_PORT: 5432
    env_file: [.env]
    stop_grace_period: 40s
    volumes:
      - type: bind
        source: /mnt/tipificador
        target: /mnt/tipificador
        read_only: true
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  reporting:
    build: .
    image: paradas-faena:2.0.0
    entrypoint: ["uv", "run", "python", "web/manage.py", "apply_reporting"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: America/Argentina/Buenos_Aires
      DJANGO_SETTINGS_MODULE: config.settings
      DB_HOST: db
      DB_PORT: 5432
    env_file: [.env]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  web:
    build: .
    image: paradas-faena:2.0.0
    entrypoint: ["uv", "run", "uvicorn", "config.asgi:application",
                 "--app-dir", "web", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      reporting:
        condition: service_completed_successfully
    environment:
      TZ: America/Argentina/Buenos_Aires
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings
      DB_HOST: db
      DB_PORT: 5432
    env_file: [.env]
    ports:
      - "${MONITOR_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 10s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  redis-data:
  db-data:
