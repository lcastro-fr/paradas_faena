[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paradas-faena"
version = "2.0.0"
description = "Daemon que registra pedidos de parada de linea y velocidad desde los PLCs de faena"
requires-python = ">=3.11"
dependencies = [
    "pycomm3>=1.2.14",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
paradas-faena = "paradas_faena.__main__:main"
dump-inputs = "paradas_faena.tools.dump_inputs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 92
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
